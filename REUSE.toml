version = 1

# Templates: a license comment at the top of a template would be copied
# into every page, and for some partials into the middle of an attribute.
[[annotations]]
path = "layouts/**"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

# Data files read by Hugo: JSON has no comments, and Hugo reads every file
# of the directory.
[[annotations]]
path = "data/**"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

# Images of the posts that are the author's own work.  Images from third
# parties get their own entry, with their own holder and license.
[[annotations]]
path = "content/posts/2022-12-02-jane-s-infinite-rosary/images/**"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "CC-BY-4.0"

# Diagrams of the hats posts, by the author.
[[annotations]]
path = "content/posts/2020-09-26-infinitely-many-hats-3-3/images/**"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "CC-BY-4.0"

# The pictures at the head of the three hats posts show characters of the
# game Team Fortress 2 under towers of hats.  They are not the author's
# work and are not under the licenses of this repository.
[[annotations]]
path = [
  "content/posts/2020-08-30-tower-of-hats/images/hats-towering-pillar.png",
  "content/posts/2020-08-30-the-game-of-hats/images/hats-towering-pillar.png",
  "content/posts/2020-09-05-hats-calculator/images/hats-medic.png",
  "content/posts/2020-09-26-infinitely-many-hats-3-3/images/infinite-alpha.webp",
]
SPDX-FileCopyrightText = "Valve Corporation"
SPDX-License-Identifier = "LicenseRef-third-party"

# Interactive figures (HTML and JavaScript), by the author.  Those of
# jane-s-rosary were imported from github.com/douzebis/jane-s-rosary at
# commit 947bd74582e5ae7309160c69ef2521e4180de533 (2023-01-05); those of hats
# from github.com/douzebis/hats at commit
# a7d108a7d603a9c75485b422d3fcdbd5f78fac03 (2022-11-11).
[[annotations]]
path = "figures/**"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

# Earlier versions of the papers are kept byte for byte: no header is
# added to their files (docs/invariants/0003-frozen-versions.md).
[[annotations]]
path = "content/versions/**"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "CC-BY-4.0"

# The same three pictures in the kept posts of 2020.
[[annotations]]
path = [
  "content/versions/the-game-of-hats/2020/2020-08-30-tower-of-hats/images/hats-towering-pillar.png",
  "content/versions/the-game-of-hats/2020/2020-09-05-hats-calculator/images/hats-medic.png",
  "content/versions/the-game-of-hats/2020/2020-09-26-infinitely-many-hats-3-3/images/infinite-alpha.webp",
]
SPDX-FileCopyrightText = "Valve Corporation"
SPDX-License-Identifier = "LicenseRef-third-party"

# Kept outputs of long runs.
[[annotations]]
path = "research/**/results/**"
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
