<!DOCTYPE html>
<html lang="en">
<head>
    <title>Network</title>
    <script
        type="text/javascript"
        src="../lib/jquery.min.js">
    </script>
    <script
        type="text/javascript"
        src="../lib/vis-network.min.js"
    ></script>
    <script
        type="text/javascript"
        src="./janestreet.js"
    ></script>
</head>
<body>
    <div
        id="network"
        style="position: relative; width: 100%; border: none">
    </div>
    <script type="text/javascript">

        // Set "container" and "network" div height
        let NETWORK = $('#network');
        let BASE = NETWORK.width();
        NETWORK.css('height', BASE*0.27);

        // Retrieve URL parameters
        const P = new Proxy(new URLSearchParams(window.location.search), {
            get: (searchParams, prop) => searchParams.get(prop),
        })
        // P.n          Count of nodes to display
        // P.labels     ['position', 'label', 'plain', 'height', 'reluctant_inv']
        // P.arrows     ['none', 'up', 'down', 'both', 'to3']
        // P.below      ['position', 'label']: what is written under each bead,
        //              as '#3' for a position and 'L=2' for a label
        // P.end        ['open']: the last bead is a bead like the others and
        //              a dashed piece of string leaves it to the right;
        //              without it the last bead shows '..'
        // P.string     ['yes']: draw the string even when there are arrows
        // P.colors     ['label', 'direction']: the color of an arrow says
        //              how long it is, or which way it goes; every arrow of
        //              every bead is drawn, those that leave the picture
        //              fade out, and with arrows=to3 those that are not
        //              on the shortest recitation are dimmed.  Without it
        //              the color follows the bead the arrow leaves.
        // Without them: positions, no arrows (as the first version of the
        // post calls this page).  The earlier versions of the paper link to
        // this page without the last three parameters and must keep the
        // figures they describe.
        N = parseInt(P.n)
        const LABELS = P.labels || 'position'
        const ARROWS = P.arrows || 'none'
        const BELOW = P.below || 'none'
        const OPEN = P.end == 'open'
        const STRING = ARROWS == 'none' || P.string == 'yes'
        const COLORS = P.colors || 'bead'
        const STEP = (BASE - BASE/N/2.2)/N
        const PALETTE = ['#e03131', '#f08c00', '#2f9e44', '#1c7ed6', '#9c36b5']
        function arrow_color(i, way) {
            if (COLORS == 'direction') return way == 'u' ? PALETTE[0] : PALETTE[3]
            return PALETTE[(label(i) - 1)%PALETTE.length]
        }

        // Create nodes
        var nodes = new vis.DataSet([])
        for (let i = 0; i < N; ++i) {
            let diam = BASE/N/2.2
            nodes.add([
                {
                    id: '' + i,
                    shape: 'circle',
                    widthConstraint: diam,
                    color: is_black(i) ? hsl_to_col(0, 0., 50.) : hsl_to_col(0, 0., 90.),
                    font: {
                        size: BASE/4/N,
                        color: is_white(i) ? hsl_to_col(0, 0., 50.) : hsl_to_col(0, 0., 90.),
                    },
                    label: i == N-1 && !OPEN ? '..' : f_label(i, LABELS),
                    x: diam/2 + i*(BASE - diam)/N,
                    y: 0,
                }
            ])
        }

        if (OPEN) {
            // Where the dashed piece of string ends: a node that is not
            // seen, so that the view makes room for it.
            nodes.add([
                {
                    id: 'end',
                    shape: 'dot',
                    size: 0.01,
                    color: 'rgba(0, 0, 0, 0)',
                    x: BASE/N/2.2/2 + (N - 0.15)*STEP,
                    y: 0,
                }
            ])
        }

        // Create edges
        var edges = new vis.DataSet([])
        if (STRING) {
            for (let i = 0; i < N - 1; ++i) {
                edges.add([
                    {
                        id: 's' + i,
                        from: i,
                        to: i + 1,
                        color: hsl_to_col(0, 0., 50.),
                        smooth: false,
                        width: 1,
                    },
                ])
            }
        }
        // With arrows that fade out, the dashed piece is drawn later, on
        // top of what hides them.
        if (OPEN && COLORS == 'bead') {
            edges.add([
                {
                    id: 'send',
                    from: N - 1,
                    to: 'end',
                    color: hsl_to_col(0, 0., 50.),
                    smooth: false,
                    dashes: [BASE/250, BASE/250],
                    width: 1,
                },
            ])
        }
        // With the last bead a bead like the others, it has arrows too.
        const LAST = OPEN ? N : N - 1
        if (ARROWS == 'none') {
        } else if (COLORS != 'bead') {
            // The moves of the shortest recitation to bead 3 (counted
            // from 0), with their numbers.
            const told = {}
            if (ARROWS == 'to3') {
                for (let i of [1, 2, 4, 7, 3]) {
                    told[(back(i) < i ? 'u' : 'd') + back(i)] = height(i)
                }
            }
            const arrows = []
            for (let i = 0; i < N; ++i) {
                if (ARROWS != 'down') arrows.push(['u', i, up(i)])
                if (ARROWS != 'up' && i > 0) arrows.push(['d', i, down(i)])
            }
            // The dimmed arrows first, so that the others are drawn on them.
            const dimmed = ([way, i, to]) => ARROWS == 'to3' && !(way + i in told)
            arrows.sort((a, b) => dimmed(b) - dimmed(a))
            for (let [way, i, to] of arrows) {
                if (to >= N && nodes.get('' + to) == null) {
                    // A bead beyond the picture: not seen, it is only
                    // there for the arrow to aim at.
                    nodes.add([
                        {
                            id: '' + to,
                            shape: 'dot',
                            size: BASE/N/3.6,
                            color: 'rgba(0, 0, 0, 0)',
                            x: BASE/N/2.2/2 + to*STEP,
                            y: 0,
                        }
                    ])
                }
                const edge = {
                    id: way + i,
                    from: i,
                    to: to,
                    arrows: {to: {enabled: true, scaleFactor: 0.2}},
                    color: {color: arrow_color(i, way), opacity: dimmed([way, i, to]) ? 0.3 : 1},
                    smooth: {enabled: true, type: 'curvedCW'},
                    width: dimmed([way, i, to]) ? 1.5 : 2,
                }
                if (way + i in told) {
                    edge.label = '' + told[way + i]
                    edge.font = {size: BASE/8/N, vadjust: -BASE/8/N}
                }
                edges.add([edge])
            }
        } else if (ARROWS == 'to3') {
            for (let i of [1, 2, 4, 7, 3]) {
                edges.add([
                    {
                        id: '' + i,
                        from: back(i),
                        to: i,
                        arrows: {to: {enabled: true, scaleFactor: 0.2}},
                        label: '' + height(i),
                        font: {
                            size: BASE/8/N,
                            //align: 'middle',
                            vadjust: -BASE/8/N,
                        },
                        color: hsl_to_col(8*back(i), 80., 50.),
                        smooth: {enabled: true, type: 'curvedCW'},
                        width: 2,
                    },
                ])
            }
        } else {
            if (ARROWS == 'up' || ARROWS == 'both') {
                for (let i = 0; i < LAST; ++i) {
                    edges.add([
                        {
                            id: 'u' + i,
                            from: i,
                            to: up(i),
                            arrows: {to: {enabled: true, scaleFactor: 0.2}},
                            color: hsl_to_col(8*i, 80., 50.),
                            smooth: {enabled: true, type: 'curvedCW'},
                            width: 2,
                        },
                    ])
                }
            }
            if (ARROWS == 'down' || ARROWS == 'both') {
                for (let i = 1; i < LAST; ++i) {
                    edges.add([
                        {
                            id: 'd' + i,
                            from: i,
                            to: down(i),
                            arrows: {to: {enabled: true, scaleFactor: 0.2}},
                            color: hsl_to_col(8*i, 80., 50.),
                            smooth: {enabled: true, type: 'curvedCW'},
                            width: 2,
                        },
                    ])
                }
            }
        }

        // Create a network
        var container = document.getElementById("network")
        var data = {
            nodes: nodes,
            edges: edges,
        }
        var options = {
        // https://github.com/visjs/vis-network/issues/671
        interaction: {
            dragNodes: P.interactive == 'yes' ? true: false,
            dragView: P.interactive == 'yes' ? true: false,
            keyboard: false,
            zoomView: P.interactive == 'yes' ? true: false,
        },
        physics: false,
        edges: THEME.edges,
      }
      var network = new vis.Network(container, data, options);
      //network.fit()

      // The view is that of the beads: the arrows that leave the picture
      // fade into the background to the right of the last bead.
      if (COLORS != 'bead') {
          const seen = []
          for (let i = 0; i < N; ++i) seen.push('' + i)
          if (OPEN) seen.push('end')
          network.fit({nodes: seen})
          network.on('afterDrawing', (ctx) => {
              const box = network.getBoundingBox('' + (N - 1))
              const from = box.right + 0.03*STEP
              const to = box.right + 0.36*STEP
              const fade = ctx.createLinearGradient(from, 0, to, 0)
              fade.addColorStop(0, THEME.background + '00')
              fade.addColorStop(1, THEME.background)
              ctx.fillStyle = fade
              ctx.fillRect(from, -2*BASE, 4*BASE, 4*BASE)
              if (OPEN) {
                  const y = (box.top + box.bottom)/2
                  ctx.strokeStyle = hsl_to_col(0, 0., 50.)
                  ctx.lineWidth = 1
                  ctx.setLineDash([BASE/250, BASE/250])
                  ctx.beginPath()
                  ctx.moveTo(box.right, y)
                  ctx.lineTo(network.getPositions(['end']).end.x, y)
                  ctx.stroke()
                  ctx.setLineDash([])
              }
          })
      }

      // The position or the label of each bead, written under it.
      if (BELOW == 'position' || BELOW == 'label') {
          network.on('afterDrawing', (ctx) => {
              const size = BASE/6.5/N
              ctx.font = size + 'px arial'
              ctx.fillStyle = THEME.text
              ctx.textAlign = 'center'
              ctx.textBaseline = 'top'
              for (let i = 0; i < N; ++i) {
                  const box = network.getBoundingBox('' + i)
                  ctx.fillText(
                      BELOW == 'label' ? 'L=' + label(i) : '#' + f_label_position(i),
                      (box.left + box.right)/2, box.bottom + size*0.45)
              }
          })
      }
    </script>
  </body>
</html>
