{{ define "main" }}
  {{ .Content }}
  <ul class="post-list">
    {{- range (where site.RegularPages "Section" "posts").ByDate.Reverse }}
    {{- $lang := partial "lang.html" . }}
    <li lang="{{ $lang }}">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ partial "date.html" (dict "date" .Date "lang" $lang) }}</time>
    </li>
    {{- end }}
  </ul>
{{ end }}
