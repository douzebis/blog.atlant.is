baseURL = "https://blog.atlant.is/"
title = "Atlantis"
locale = "en"
enableGitInfo = false
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "Prends garde à la douceur des choses"
  author = "Frederic Ruget"

[markup.goldmark.renderer]
  # The posts exported from WordPress contain raw HTML.
  unsafe = true

[markup.goldmark.extensions.passthrough]
  # Formulas go to MathJax untouched by the Markdown processor.
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$'], ['\[', '\]']]
  inline = [['$', '$'], ['\(', '\)']]

[markup.highlight]
  # Colors come from assets/css/syntax.css, which has a light and a dark set.
  noClasses = false

# Addresses that the site serves from its own copy.  The posts keep the
# public address (so that their source works anywhere); links to it are
# rewritten to the copy that the build puts in the site (site.nix).
[[params.localCopies]]
  from = "https://douzebis.github.io/jane-s-rosary/"
  to = "figures/jane-s-rosary/"
