baseURL = "https://blog.atlant.is/"
title = "Atlantis"
locale = "en"
enableGitInfo = false
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "Prends garde à la douceur des choses"
  author = "Frederic Ruget"

[markup.goldmark.renderer]
  # The posts exported from WordPress contain raw HTML.
  unsafe = true

[markup.goldmark.extensions.passthrough]
  # Formulas go to MathJax untouched by the Markdown processor.
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$'], ['\[', '\]']]
  inline = [['$', '$'], ['\(', '\)']]

[markup.highlight]
  # Colors come from assets/css/syntax.css, which has a light and a dark set.
  noClasses = false

# The posts name the interactive figures by their address on the final site
# (so that their source works anywhere: GitHub's view, a LaTeX version).
# Links to them are rewritten to the copy in the site being built, whatever
# its address (a preview, a local build).
[[params.localCopies]]
  from = "https://blog.atlant.is/figures/"
  to = "figures/"
