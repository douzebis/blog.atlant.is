# Builds the site with Nix and publishes it on GitHub Pages as a preview.
# The repository's Pages source must be set to "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build the site
        run: |
          nix-build site.nix \
            --argstr baseURL "https://douzebis.github.io/blog.atlant.is/" \
            2>&1 | tee /tmp/site-build.log
      - name: Build it again and compare (docs/invariants/0001)
        run: |
          nix-build site.nix \
            --argstr baseURL "https://douzebis.github.io/blog.atlant.is/" \
            --check 2>&1 | tee /tmp/site-rebuild.log
      - name: Copy the site out of the Nix store
        run: cp -rL result public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # The arXiv version, built from the same source as the page.  The build
  # fails if the text no longer fits the paper: a passage that build.py
  # rewords has moved, a table has no widths, a line is overfull.  A separate
  # job: a failure here does not keep the site from being published.
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build the paper
        run: |
          nix-build arxiv/jane-s-rosary -o paper-result \
            2>&1 | tee /tmp/rosary-paper-build.log
      - uses: actions/upload-artifact@v7
        with:
          name: rosary-paper
          path: |
            paper-result/paper.pdf
            paper-result/arxiv-source.tar.gz

  # The proofs checked by Lean (docs/invariants/0004).  A separate job: a
  # failure here does not keep the site from being published.
  formal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check the formal proofs
        run: |
          nix-build formal/jane-s-rosary -o formal-result \
            2>&1 | tee /tmp/rosary-formal-build.log
          cp formal-result/check.log rosary-check.log
      - uses: actions/upload-artifact@v7
        with:
          name: rosary-check-log
          path: rosary-check.log
      # GitHub signs the statement "this run, at this commit, produced this
      # log": gh attestation verify rosary-check.log --repo douzebis/blog.atlant.is
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: rosary-check.log

  # The proofs that use Mathlib.  Lean and Mathlib come from the network,
  # in the versions pinned by the project.
  formal-real:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check the formal proofs that use Mathlib
        run: |
          nix-shell formal/shell.nix --run "bash formal/check-real.sh" \
            > /tmp/rosary-real-check.log 2>&1 || { tail -50 /tmp/rosary-real-check.log; exit 1; }
          tail -15 /tmp/rosary-real-check.log
          cp formal/jane-s-rosary-real/check.log rosary-real-check.log
          cp formal/jane-s-rosary-real/recheck.log rosary-real-recheck.log
      # The hats project uses the Mathlib that the step above fetched.
      - name: Check the formal proofs of the hats article
        run: |
          nix-shell formal/shell.nix --run "bash formal/check-hats.sh" \
            > /tmp/hats-check.log 2>&1 || { tail -50 /tmp/hats-check.log; exit 1; }
          tail -8 /tmp/hats-check.log
      - uses: actions/upload-artifact@v7
        with:
          name: rosary-real-check-log
          path: |
            rosary-real-check.log
            rosary-real-recheck.log
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            rosary-real-check.log
            rosary-real-recheck.log

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
